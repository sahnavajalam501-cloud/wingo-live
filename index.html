<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wingo Snapshot Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Wingo Snapshot Dashboard</h1><p>Import records exported from the Chrome extension. This dashboard does not predict or place bets.</p></header><main><section class="toolbar"><label>Import JSON/CSV <input type="file" id="file" accept=".json,.csv,application/json,text/csv"></label><button id="demo">Load sample</button><button id="export">Export filtered JSON</button><button id="clear">Clear dashboard</button></section><section class="stats"><article><span>Total records</span><strong id="total">0</strong></article><article><span>Unique periods</span><strong id="periods">0</strong></article><article><span>Latest period</span><strong id="latest">—</strong></article></section><section class="filters"><input id="search" placeholder="Search period / number / color"><select id="size"><option value="">All sizes</option><option>Big</option><option>Small</option></select><select id="color"><option value="">All colors</option><option>Red</option><option>Green</option><option>Violet</option></select></section><div class="tablewrap"><table><thead><tr><th>Period</th><th>Number / Result</th><th>Color</th><th>Size</th><th>Captured at</th><th>Source</th></tr></thead><tbody id="tbody"><tr><td colspan="6">Import your extension JSON or CSV file.</td></tr></tbody></table></div><p id="message" class="message"></p></main><script src="app.js"></script></body></html>
